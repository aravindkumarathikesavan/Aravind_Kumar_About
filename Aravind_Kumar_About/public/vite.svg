<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ak-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="50%" stop-color="#8b85ff"/>
      <stop offset="100%" stop-color="#00d4aa"/>
    </linearGradient>
    <linearGradient id="ak-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141424"/>
      <stop offset="100%" stop-color="#0a0a10"/>
    </linearGradient>
  </defs>
  <!-- Background badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ak-bg)" stroke="url(#ak-grad)" stroke-width="3" />
  <!-- Center <AK/> typography -->
  <text x="50%" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="21" letter-spacing="-0.5px">
    <tspan fill="#00d4aa">&lt;</tspan><tspan fill="#ffffff">AK</tspan><tspan fill="#6c63ff">/&gt;</tspan>
  </text>
</svg>